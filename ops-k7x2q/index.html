<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060c09"><title>Dashboard</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../app.css"></head><body>
<div id="app"></div>
<script type="module">
import {getSettings,saveSettings,list,save,del,STATUS,send,watch,watchThreads,setThread,clicks} from '../firebase/data.js';
import {login,session,logout,reset,createStaff} from '../firebase/auth.js';
import {e,$,u,pic,chart} from '../ui.js';
import {view} from '../rtc.js';
const A=$('#app'),R=[],NEW={team:{name:'New member',role:'',blurb:'',phone:'',email:'',photo:'',status:'available',statusNote:''},faq:{k:'keyword1,keyword2',a:'Answer'},showcase:{title:'New item',img:'',link:''}};
let ss,tab,K={},name='Admin',subs=[],tsub=()=>{},cs=null,stopV=()=>{},TH=[],seen=JSON.parse(localStorage.snk_seen||'{}'),gsub=()=>{},loaded=0,prev={};
const rooms=y=>/^room/.test(y.sid),unread=()=>TH.filter(y=>!rooms(y)&&y.from!='staff'&&y.t>(seen[y.sid]||0)).length;
const badge=()=>{const b=$('[data-t=inbox]');if(b)b.textContent='Inbox'+(unread()?' ('+unread()+')':'')};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.18)}catch(x){}};
function renderTH(){const x=$('#th');if(!x)return;x.innerHTML=TH.filter(y=>!rooms(y)).map(y=>{const un=y.from!='staff'&&y.t>(seen[y.sid]||0);return`<div class="m" data-a="th" data-s="${e(y.sid)}" data-n="${e(y.by||'Visitor')}" style="cursor:pointer;max-width:100%;${un?'border:1px solid var(--ac)':''}"><b>${un?'🔵 ':''}${e(y.by||'Visitor')}</b>→ ${e(y.member||'')}${y.no?' · '+e(y.no):''}${y.st?' · '+e(y.st):''}${y.rate?' · '+'⭐'.repeat(y.rate):''}<br><small>${e(y.last)}</small>${y.issue?`<br><small style="color:var(--ac)">${e(y.issue)} · ${e(y.site||'')}</small>`:''}</div>`}).join('')||'<small>Kono chat nei.</small>'}
function startG(){gsub();loaded=0;gsub=watchThreads(d=>{TH=d;if(cs){const c=TH.find(y=>y.sid==cs);if(c&&c.from!='staff')seen[cs]=c.t}
if(loaded)TH.filter(y=>!rooms(y)&&y.from!='staff'&&y.sid!=cs&&y.t>(prev[y.sid]||0)).forEach(y=>{beep();try{if(Notification.permission=='granted')new Notification(y.by||'Visitor',{body:y.last})}catch(x){}});
TH.forEach(y=>prev[y.sid]=y.t);badge();renderTH();if(!loaded){loaded=1;if(tab=='dash')draw()}},ss.role=='member'?ss.mid:undefined)}
const reg=o=>R.push(o)-1;
const load=async c=>K[c]||(K[c]=c=='s'?await getSettings():(await list(c).catch(()=>[]))||[]);
function fld(o,k,t,type){const d=`data-o="${reg(o)}" data-k="${k}"`;
if(type=='i')return`<label>${t}<input type="file" accept="image/*" ${d}></label>${o[k]?`<img src="${e(o[k])}" alt="" style="height:70px;border-radius:14px;margin-bottom:8px">`:''}`;
if(type=='a')return`<label>${t}<textarea rows="3" ${d}>${e(o[k])}</textarea></label>`;
if(type=='s')return`<label>${t}<select ${d}>${Object.entries(STATUS).map(([x,[n]])=>`<option value="${x}" ${o[k]==x?'selected':''}>${n}</option>`).join('')}</select></label>`;
return`<label>${t}<input value="${e(o[k])}" ${d}></label>`}
const btns=(c,o)=>{const i=reg(o);return`<div class="acts"><button data-a="sv" data-c="${c}" data-i="${i}">💾 Save</button><button data-a="dl" data-c="${c}" data-i="${i}" style="background:#ff6b6b;color:#fff">🗑 Delete</button></div>`};
function loginUI(){A.innerHTML=`<div class="af" style="max-width:560px;padding-top:5vh"><div class="hero login"><span class="pill">🔒 Private control room<span class="ar">→</span></span><h1 style="font-size:clamp(30px,7vw,44px)">Welcome back</h1><p>Login kore site, team ar chat manage korun.</p><div class="lf"><input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="cta" data-a="in">Login</button><div class="hb"><button class="cta g" data-a="fp">Forgot password</button><a class="cta g" href="../index.html">← Site</a></div></div></div></div>`}
async function body(){
if(tab=='dash'){const[t,ck]=await Promise.all([load('team'),clicks().catch(()=>[])]);
const th=TH.filter(y=>!rooms(y)),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d}),
lab=days.map(d=>d.toLocaleDateString('en',{weekday:'short'})),val=days.map(d=>th.filter(y=>{const z=new Date(y.ct||y.t);z.setHours(0,0,0,0);return +z==+d}).length);K.cl=lab;K.cv=val;
const tk=th.filter(y=>y.issue),cnt=k=>tk.filter(y=>(y.st||'open')==k).length,rt=th.filter(y=>y.rate),av=rt.length?(rt.reduce((a,y)=>a+y.rate,0)/rt.length).toFixed(1):'-',bs={};tk.forEach(y=>{const k=y.site||'?';bs[k]=(bs[k]||0)+1});
const row=(n,x)=>`<div class="m" style="max-width:100%;margin-bottom:6px"><b>${n}</b>${e(x)}</div>`;
return`<div class="card"><div class="kp"><div><b>${th.length}</b><small>Chats</small></div><div><b>${tk.length}</b><small>Tickets</small></div><div><b>${cnt('solved')}</b><small>Solved</small></div><div><b>${av}</b><small>Rating</small></div></div><h3>Active chats (7 din)</h3>${chart(lab,val)}<button class="btn g" data-a="pub">📤 Home chart-e publish korun</button></div>
<div class="card"><h3>Ticket status</h3>${row(cnt('open'),'Open')}${row(cnt('work'),'Working')}${row(cnt('solved'),'Solved')}<h3 style="margin-top:14px">Beshi problem kon site-e</h3>${Object.entries(bs).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([k,n])=>row(n,k)).join('')||'<small>Ekhono nei</small>'}<h3 style="margin-top:14px">Site click</h3>${ck.sort((x,y)=>y.n-x.n).map(c=>row(c.n,c.id)).join('')||'<small>Ekhono nei</small>'}</div>
<div class="card"><h3>Team status</h3>${t.map(m=>`<div class="m" style="max-width:100%;margin-bottom:6px"><b>${e(m.name)}</b>${(STATUS[m.status]||[''])[0]}${m.statusNote?' · '+e(m.statusNote):''}</div>`).join('')}</div><div class="card"><button class="btn g" data-a="bk">⬇ Backup (JSON)</button></div>`}
if(tab=='settings'){const S=await load('s');return`<div class="card">${[['name','Site naam'],['tagline','Tagline'],['phone','Main WhatsApp number'],['website','Website'],['apkUrl','APK download link'],['heroT','Hero title'],['heroS','Hero subtitle'],['heroB','Hero badge text (pill)'],['heroC','Hero color (#hex, jemon #ff5f1f)'],['heroG','Hero glow color (#hex, jemon #ffe39a)'],['chT','Chart title'],['chL','Chart labels (comma diye)'],['chV','Chart values (comma diye)'],['oh1','Office open hour (0-23, Dhaka time)'],['oh2','Office close hour (0-23)'],['meetTopic','Team meeting topic'],['meetLink','Meet / Zoom link']].map(([k,t])=>fld(S,k,t)).join('')}${fld(S,'logo','Logo','i')}${fld(S,'heroI','Hero background','i')}${fld(S,'autoMsg','Auto reply (office time-er baire)','a')}${fld(S,'qrs','Quick replies (ek line-e ekta)','a')}<button class="btn" data-a="ss">💾 Save settings</button></div>`}
if(tab=='team'){const T=await load('team');return T.map(m=>{const i=reg(m);return`<div class="card">${fld(m,'name','Naam')}${fld(m,'role','Role')}${fld(m,'blurb','Intro','a')}${fld(m,'phone','WhatsApp / Call number (88017...)')}${fld(m,'email','Email')}${fld(m,'photo','Profile chobi (boro)','i')}${fld(m,'status','Status','s')}${fld(m,'statusNote','Status note')}${btns('team',m)}${m.id?`<label style="margin-top:12px">Staff login<input id="se${i}" placeholder="staff email"><input id="sp${i}" placeholder="password (6+ char)"></label><button class="btn g" data-a="mk" data-i="${i}">Create staff login</button>`:''}</div>`}).join('')+`<button class="btn" data-a="ad" data-c="team" style="margin-top:18px">+ Add member</button>`}
if(tab=='faq'){const F=await load('faq');return F.map(f=>`<div class="card">${fld(f,'k','Keywords (comma diye)')}${fld(f,'a','Answer','a')}${btns('faq',f)}</div>`).join('')+`<button class="btn" data-a="ad" data-c="faq" style="margin-top:18px">+ Add FAQ</button>`}
if(tab=='showcase'){const H=await load('showcase');return H.map(s=>`<div class="card">${fld(s,'title','Title')}${fld(s,'img','Chobi','i')}${fld(s,'link','Link (optional)')}${btns('showcase',s)}</div>`).join('')+`<button class="btn" data-a="ad" data-c="showcase" style="margin-top:18px">+ Add item</button>`}
if(tab=='me'){const T=await load('team'),m=T.find(x=>x.id==ss.mid);if(!m)return'<div class="card">Profile pawa jayni.</div>';return`<div class="card"><h3>${e(m.name)}</h3>${fld(m,'status','Status','s')}${fld(m,'statusNote','Status note')}<button class="btn" data-a="sv" data-c="team" data-i="${reg(m)}">💾 Save</button></div>`}
if(tab=='inbox'){const T=await load('team'),S=await load('s'),Q=(S.qrs||'Apnar website link din\nEkta screenshot pathan\nAmra problem ta dekhchi, ektu opekkha korun\nDhonnobad, ar kichu lagle bolben').split('\n').filter(Boolean);
return`<div class="card"><h3>Chats</h3><div id="th"></div></div><div class="card" id="tp" hidden><b id="tt"></b><div class="hb" style="margin:8px 0"><button class="btn g" data-a="rq">🖥 Screen share chai</button><button class="btn g" data-a="vw">👁 Screen dekhun</button><button class="btn g" data-a="vs">⏹ Stop</button></div><video id="sv" autoplay playsinline controls hidden style="width:100%;border-radius:14px;background:#000"></video><div class="hb" style="margin:8px 0"><button class="btn g" data-a="sto">🟢 Open</button><button class="btn g" data-a="stw">🛠 Working</button><button class="btn" data-a="sts">✅ Solved</button></div><div class="msgs" id="tm"></div><div class="hb" style="margin-bottom:8px">${Q.map(q=>`<button class="btn g" data-a="qk" data-q="${e(q)}" style="padding:6px 12px;font-size:13px">${e(q)}</button>`).join('')}</div><div class="acts"><input id="ri" placeholder="Reply..."><button data-a="rp">Send</button></div><div class="acts"><select id="trs" style="flex:2;margin:0">${T.map(x=>`<option value="${e(x.id)}">${e(x.name)}</option>`).join('')}</select><button data-a="trf">🔁 Transfer</button></div></div>`}
if(tab=='room'){const S=await load('s');return`<div class="card"><h3>${e(S.meetTopic||'Team meeting')}</h3>${S.meetLink?`<a class="btn" target="_blank" rel="noopener" href="${u(S.meetLink)}">🎥 Join meeting</a>`:''}<div class="msgs" id="rm"></div><div class="acts"><input id="rmi" placeholder="Team-ke likhun..."><button data-a="mr">Send</button></div></div>`}}
async function draw(){subs.forEach(f=>f());subs=[];tsub();stopV();R.length=0;const sup=ss.role=='super',tabs=sup?[['dash','Dashboard'],['settings','Settings'],['team','Team'],['faq','FAQ'],['showcase','Websites'],['inbox','Inbox'],['room','Meeting']]:[['me','My status'],['inbox','Inbox'],['room','Meeting']];tab=tab||tabs[0][0];
const h=await body();A.innerHTML=`<div class="abar"><b>⚙ ${sup?'Owner':e(name)}</b><span><a class="btn g" href="../index.html">Site</a> <button class="btn g" data-a="out">Logout</button></span></div><div class="tabs">${tabs.map(([k,t])=>`<button class="btn ${k==tab?'':'g'}" data-t="${k}">${t}${k=='inbox'&&unread()?' ('+unread()+')':''}</button>`).join('')}</div><div class="af">${h}</div>`;
if(tab=='inbox')renderTH();
if(tab=='room')subs.push(watch('room-team',d=>{const x=$('#rm');if(x){x.innerHTML=d.map(y=>`<div class="m"><b>${e(y.by)}</b>${e(y.text)}</div>`).join('')||'<small>Ekhono message nei.</small>';x.scrollTop=1e9}}))}
function openT(s,n){tsub();cs=s;const th=TH.find(y=>y.sid==s);if(th){seen[s]=th.t;localStorage.snk_seen=JSON.stringify(seen);badge();renderTH()}$('#tp').hidden=false;$('#tt').textContent=n;tsub=watch(s,d=>{const x=$('#tm');if(x&&cs==s){x.innerHTML=d.map(y=>`<div class="m ${y.from=='staff'?'me':''}">${e(y.text)}${y.img?`<img src="${e(y.img)}" alt="">`:''}</div>`).join('');x.scrollTop=1e9}})}
A.addEventListener('input',ev=>{const t=ev.target,k=t.dataset.k;if(k&&t.type!='file')R[t.dataset.o][k]=t.value});
A.addEventListener('change',async ev=>{const t=ev.target,k=t.dataset.k;if(k&&t.type=='file'&&t.files[0]){R[t.dataset.o][k]=await pic(t.files[0],k=='heroI'?900:600,k=='logo'?'image/png':'image/jpeg');draw()}});
A.onclick=async ev=>{const b=ev.target.closest('[data-a],[data-t]');if(!b)return;const d=b.dataset,o=R[d.i];
try{if(d.t){tab=d.t;K={};return draw()}
if(d.a=='in'){try{Notification.requestPermission()}catch(z){}await login($('#le').value.trim(),$('#lp').value);return init()}
if(d.a=='fp'){await reset($('#le').value.trim());return alert('Reset email pathano hoyeche.')}
if(d.a=='out'){gsub();await logout();ss=null;K={};return loginUI()}
if(d.a=='ss'){await saveSettings(K.s);return alert('Saved')}
if(d.a=='sv'){await save(d.c,o);delete K[d.c];return alert('Saved')}
if(d.a=='dl'){if(o.id&&confirm('Delete korben?')){await del(d.c,o.id);delete K[d.c];draw()}return}
if(d.a=='ad'){await save(d.c,{...NEW[d.c]});delete K[d.c];return draw()}
if(d.a=='mk'){await createStaff($('#se'+d.i).value.trim(),$('#sp'+d.i).value,o.id);return alert('Staff login created')}
if(d.a=='th')return openT(d.s,d.n);
if(d.a=='rp'){const i=$('#ri'),t=i.value.trim();if(t&&cs){i.value='';await send(cs,{text:t,from:'staff',by:name})}return}
if(d.a=='rq'){if(cs)await send(cs,{text:'🖥 Amader team apnar screen dekhte chaiche. Allow chapun.',from:'staff',by:name,kind:'req'});return}
if(d.a=='vw'){if(!cs)return;stopV();const v=$('#sv');v.hidden=false;stopV=await view(cs,v,()=>{v.hidden=true});return}
if(d.a=='vs'){stopV();$('#sv').hidden=true;return}
const stt=async(k,t)=>{if(!cs)return;await setThread(cs,{st:k});await send(cs,{text:t,from:'staff',by:name,kind:'st:'+k})};
if(d.a=='sto')return stt('open','🟢 Ticket open hoyeche');
if(d.a=='stw')return stt('work','🛠 Amra kaj korchi');
if(d.a=='sts')return stt('solved','✅ Problem solve hoyeche');
if(d.a=='qk'){$('#ri').value=d.q;$('#ri').focus();return}
if(d.a=='trf'){const T=K.team||[],t=T.find(x=>x.id==$('#trs').value);if(!cs||!t)return;await setThread(cs,{mid:t.id,member:t.name});await send(cs,{text:'🔁 Chat '+t.name+'-er kache transfer hoyeche',from:'staff',by:name,kind:'st:tr'});return alert('Transfer hoyeche')}
if(d.a=='pub'){const S=await load('s');S.chT='Active chats (last 7 days)';S.chL=K.cl.join(',');S.chV=K.cv.join(',');await saveSettings(S);return alert('Home chart update hoyeche')}
if(d.a=='bk'){const o={settings:await getSettings(),team:await list('team'),faq:await list('faq'),showcase:await list('showcase').catch(()=>[])},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();return}
if(d.a=='mr'){const i=$('#rmi'),t=i.value.trim();if(t){i.value='';await send('room-team',{text:t,from:'staff',by:name})}}
}catch(x){alert(x.message)}};
async function init(){ss=await session();if(!ss)return loginUI();tab=null;K={};if(ss.role=='member')name=(await load('team')).find(x=>x.id==ss.mid)?.name||'Staff';startG();draw()}
init();
</script></body></html>
